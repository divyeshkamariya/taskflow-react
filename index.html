<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Task Manager</title>
    <meta
      name="description"
      content="TaskFlow: a React task manager with Kanban board, calendar, reminders and charts. Your data stays in your browser."
    />
    <script>
      // Apply the saved theme before first paint (prevents a light flash)
      try {
        var t = localStorage.getItem("taskflow-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
